name: Generar documentación Javadoc

on:
  push:
    branches:
        - main
        - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
        contents: write

    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v4

      - name: 🧰 Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🧰 Instalar Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: 🧰 Instalar wkhtmltopdf
        run: sudo apt-get update && sudo apt-get install -y wkhtmltopdf

      - name: 🏗️ Generar documentación con Javadoc
        run: |
          mkdir -p docs/html
          javadoc -d docs/html -sourcepath src/main/java -subpackages com.clases
          
      - name: 🏗️ Generar archivos Markdown
        run: |
          mkdir -p docs/md
          for file in $(find docs/html -name "*.html"); do
            base=$(basename "$file" .html)
            pandoc "$file" -f html -t markdown -o "docs/md/$base.md"
          done

      - name: 📄 Convertir HTML a PDF
        run: |
          mkdir -p docs/pdf
          wkhtmltopdf --enable-local-file-access docs/html/index.html docs/pdf/documentation.pdf

      - name: 💾 Subir los cambios generados a main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "🔄 Actualización automática de documentación Javadoc" || echo "Sin cambios que subir"
          git push origin master

      - name: 🚀 Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/html
