name: Generar documentación Javadoc

on:
  push:
    branches:
        - main
        - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
        contents: write

    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v4

      - name: 🧰 Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-cffi libcairo2 libpango1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info
          pip3 install weasyprint

      - name: 🏗️ Generar documentación con Javadoc
        run: |
          mkdir -p docs/html
          javadoc -d docs/html -sourcepath src -subpackages main.java

      - name: Convertir HTML a PDF con WeasyPrint
        run: |
          mkdir -p docs/pdf
          weasyprint docs/html/overview-summary.html docs/pdf/proyecto-documentacion.pdf

      - name: 💾 Subir los cambios generados a main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "🔄 Actualización automática de documentación Javadoc" || echo "Sin cambios que subir"
          git push origin master

      - name: 🚀 Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/html
