name: Generar documentación Javadoc

on:
  push:
    branches:
        - main
        - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
        contents: write

    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v4

      - name: 🧰 Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🏗️ Generar documentación con Javadoc
        run: |
          mkdir -p docs/html
          javadoc -d docs/html src/*.java

      - name: 💾 Subir los cambios generados a main
        run: |
          git add docs/html
          git commit -m "🔄 Actualización automática de documentación Javadoc" || echo "Sin cambios que subir"
          git push origin master

      - name: 🚀 Publicar en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/html
